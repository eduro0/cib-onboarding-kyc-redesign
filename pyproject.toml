[project]
name = "cib-onboarding-kyc-redesign"
version = "0.1.0"
description = "As-Is and To-Be maps, a simulated KPI model and a human-gated AI assistant for corporate client onboarding and periodic KYC review."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eduard Rodriguez Lopez" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
